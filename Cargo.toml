[workspace]
members = [
  "crates/chachong-core",
  "src-tauri",
]
resolver = "2"

[workspace.package]
version = "0.2.3"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
async-trait = "0.1"
jieba-rs = "0.10.3"
liteparse = { version = "2", default-features = false }
lopdf = { version = "0.38", default-features = false }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["fs", "macros", "rt-multi-thread", "sync"] }
walkdir = "2"
